# "Set up the server": run once (GitHub → Actions → this workflow → Run workflow) after the Supabase project exists.
# Applies every database migration (tables, security rules, photo storage) to the owner's project and switches on
# phone sign-in through Twilio Verify, with email sign-up off (docs/OWNER_SETUP.md §5–6). Safe to run again: applied
# migrations are skipped. Needs config/app.json supabase.url and the secrets SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD; with TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN and TWILIO_VERIFY_SERVICE_SID it also sets up the
# sign-in texts.
name: set up the server

on:
  workflow_dispatch:

concurrency:
  group: setup-server
  cancel-in-progress: false

jobs:
  server:
    name: database and sign-in
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
    steps:
      - uses: actions/checkout@v4
      - name: what is set up
        id: setup
        run: |
          python3 tools/release/check_setup.py server
          echo "ref=$(python3 -c "import json,re;print(re.match(r'https://([a-z0-9]{20})', json.load(open('config/app.json'))['supabase']['url']).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
      - name: apply the database (every migration)
        working-directory: backend
        run: |
          supabase link --project-ref "${{ steps.setup.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: phone sign-in, no email sign-up
        run: |
          python3 - > auth.json <<'PY'
          import json, os
          body = {"external_phone_enabled": True, "external_email_enabled": False}
          if all(os.environ.get(k) for k in ("TWILIO_ACCOUNT_SID", "TWILIO_AUTH_TOKEN", "TWILIO_VERIFY_SERVICE_SID")):
              body.update({
                  "sms_provider": "twilio_verify",
                  "sms_twilio_verify_account_sid": os.environ["TWILIO_ACCOUNT_SID"],
                  "sms_twilio_verify_auth_token": os.environ["TWILIO_AUTH_TOKEN"],
                  "sms_twilio_verify_message_service_sid": os.environ["TWILIO_VERIFY_SERVICE_SID"],
              })
          print(json.dumps(body))
          PY
          if [ -z "$TWILIO_ACCOUNT_SID" ]; then
            echo "::warning::No Twilio secrets yet: sign-in texts are not set up (OWNER_SETUP.md §6.1). Add them and run this again."
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/${{ steps.setup.outputs.ref }}/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @auth.json)
          rm -f auth.json
          if [ "$status" -ge 300 ]; then
            echo "::error::Supabase refused the sign-in settings (HTTP $status)"; cat response.json; exit 1
          fi
          echo "sign-in settings saved"
