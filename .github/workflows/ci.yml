name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: Re-record every Android Roborazzi baseline and commit the changed images to this branch
        type: boolean
        default: false
      commit_screens:
        description: Commit the iOS demo tour's and the Android journey's screenshots to this branch (design/screens/)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: detect components
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      worker: ${{ steps.d.outputs.worker }}
      web: ${{ steps.d.outputs.web }}
      android: ${{ steps.d.outputs.android }}
      ioscore: ${{ steps.d.outputs.ioscore }}
      ios: ${{ steps.d.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          e() { if [ -f "$2" ]; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          e backend backend/package.json
          e worker backend/worker/package.json
          e web web/package.json
          e android android/settings.gradle.kts
          e ioscore ios/Packages/AppCore/Package.swift
          e ios ios/project.yml

  design:
    name: design provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: validate tokens and copy
        run: node tools/designgen.mjs --check
      - name: generated files are up to date
        run: |
          node tools/designgen.mjs
          git status --porcelain
          git diff --exit-code
      - name: no literal design values or taste-based wording in code
        run: node tools/provenance-check.mjs

  # The one-button release workflows' scripts (tools/release): setup checks, the Google Play request sequence (against a
  # fake session), the Android signing key's create → lock → unlock round trip.
  release-tools:
    name: release tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: unit tests
        run: python3 -m unittest discover -s tools/release -v

  backend:
    name: backend (Supabase, RLS, security tests)
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: start Supabase and run the suite
        working-directory: backend
        run: |
          npm ci
          bash ../.github/scripts/supabase-start.sh
          npm test

  worker:
    name: worker (jobs, collage, push, video)
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.worker == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: start Supabase
        working-directory: backend
        run: |
          npm ci
          bash ../.github/scripts/supabase-start.sh
      - name: worker tests
        working-directory: backend/worker
        run: |
          npm ci
          npm run typecheck
          npm test

  web:
    name: web (invite page, well-known files)
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: start Supabase (integration tests)
        working-directory: backend
        run: |
          npm ci
          bash ../.github/scripts/supabase-start.sh
      - name: web tests
        working-directory: web
        run: |
          npm ci
          npx playwright-core install --with-deps --only-shell chromium
          npm run typecheck
          npm test

  # Build, unit and snapshot tests, and core:data's integration tests (the Android data layer: auth, groups, storage,
  # realtime, selfies, overnight photos, schema conformance) against this job's local Supabase;
  # ANDROID_INTEGRATION_REQUIRED=1 makes an unreachable stack fail them instead of skipping them.
  android:
    name: android (build, unit, snapshot, data layer against a local Supabase)
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.android == 'true' && needs.detect.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: install Android platform 37 (Compose 1.12 needs compileSdk 37; targetSdk stays 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: start Supabase (core:data integration tests)
        working-directory: backend
        run: |
          npm ci
          bash ../.github/scripts/supabase-start.sh
          supabase status -o json | jq -r '"SUPABASE_URL=\(.API_URL)", "SUPABASE_ANON_KEY=\(.ANON_KEY)", "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"' >> "$GITHUB_ENV"
      - name: build, unit and snapshot tests
        working-directory: android
        env:
          ANDROID_INTEGRATION_REQUIRED: "1"
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee build/ci-gradle.log
          # The integration tests ran (none skipped).
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("core/data/build/test-results/testDebugUnitTest/TEST-app.data.integration.*.xml")
          tests = sum(int(ET.parse(f).getroot().get("tests", 0)) for f in files)
          skipped = sum(int(ET.parse(f).getroot().get("skipped", 0)) for f in files)
          print(f"core:data integration: {tests} tests, {skipped} skipped ({len(files)} classes)")
          sys.exit(0 if files and tests > 0 and skipped == 0 else 1)
          PY
      # What failed, in a few lines at the end of the log: compiler errors, failed tests with their first message line,
      # snapshots that no longer match their baselines.
      - name: failure summary
        if: failure()
        working-directory: android
        run: |
          echo "::group::failure summary"
          grep -E '^e: ' build/ci-gradle.log | sort -u | head -60 || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob("**/build/test-results/testDebugUnitTest/*.xml", recursive=True)):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      first = (bad.get("message") or bad.text or "").strip().splitlines()[:2]
                      print(f"FAILED {case.get('classname')}.{case.get('name')}: {' | '.join(first)[:400]}")
          PY
          echo "::endgroup::"
      # A snapshot that no longer matches its baseline: Roborazzi's new image and the comparison, to review and, when the
      # change is intended, commit as the baseline (recordRoborazziDebug needs the Android SDK; or run the workflow by
      # hand with record_snapshots, see android-record-snapshots below).
      - name: upload changed snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-snapshot-changes
          path: |
            android/**/build/outputs/roborazzi/**
            android/**/src/test/snapshots/**/*_actual.png
            android/**/src/test/snapshots/**/*_compare.png
          if-no-files-found: ignore

  # Intended changes to Android screens: run this workflow by hand on a branch with record_snapshots on; it re-records
  # every Roborazzi baseline and commits them to that branch ("Android snapshot baselines re-recorded"), to be reviewed in
  # the diff. Never runs on a push; a commit pushed with GITHUB_TOKEN starts no new workflow run.
  android-record-snapshots:
    name: android snapshot baselines (on request)
    runs-on: ubuntu-24.04
    needs: detect
    if: github.event_name == 'workflow_dispatch' && inputs.record_snapshots && needs.detect.outputs.android == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: install Android platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - name: record the baselines
        working-directory: android
        run: ./gradlew --no-daemon --continue recordRoborazziDebug || true
      - name: commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 'android/**/src/test/snapshots/**'
          if git diff --cached --quiet; then echo "no baseline changed"; exit 0; fi
          git diff --cached --stat
          git commit -m "Android snapshot baselines re-recorded (CI, at ${GITHUB_SHA::7})"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

  android-e2e:
    name: android e2e
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 40
    needs: detect
    if: needs.detect.outputs.android == 'true' && needs.detect.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      # reactivecircus/android-emulator-runner README: hardware acceleration on the Linux runners needs the KVM group.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: install Android platform 37 (Compose 1.12 needs compileSdk 37; targetSdk stays 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The journey's two fictional numbers (+1 201 555 0101 / 0102, JourneyTest.kt), the age gate and the weekly
      # question's catalogue: .github/scripts/start-test-stack.sh.
      - name: start Supabase (migrations applied) with the journey's test settings
        working-directory: backend
        run: bash ../.github/scripts/start-test-stack.sh 12015550101 12015550102
      # The worker as production runs it (renditions, the reveal's push and widget jobs, the scheduler every 5 s; no
      # APNs / FCM keys: pushes are skipped and logged). Its log is worker.log in the evidence.
      - name: start the worker
        run: bash .github/scripts/start-worker.sh android/build/e2e/worker.log
      - name: build the app and the journey
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: journey on the emulator (API 35, Google APIs)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: bash ../.github/scripts/android-e2e.sh
      - name: commit the journey's screens
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.commit_screens }}
        run: bash .github/scripts/commit-screens.sh android/build/e2e/screens design/screens/android-journey
      - name: upload screenshots, semantics dumps, logcat and the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: android/build/e2e
          if-no-files-found: warn

  # AppCore on Linux: the AppModels and AppData unit tests, and AppData's integration tests (the iOS data layer: sign-in
  # session, groups, invites, uploads, posts, realtime, selfies, plans, the weekly question, overnight photos) against
  # this job's local Supabase. The Swift image (pinned) runs on the host network so it reaches the stack at 127.0.0.1;
  # .github/scripts/ios-core-test.sh builds a libcurl with WebSockets for Realtime and sets APPDATA_INTEGRATION_REQUIRED=1,
  # so an unreachable stack fails the tests instead of skipping them.
  ios-core:
    name: ios AppCore (swift test on Linux, against a local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.ioscore == 'true' && needs.detect.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: start Supabase
        working-directory: backend
        run: |
          npm ci
          bash ../.github/scripts/supabase-start.sh
          supabase status -o json | jq -r '"SUPABASE_URL=\(.API_URL)", "SUPABASE_ANON_KEY=\(.ANON_KEY)", "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)", "SUPABASE_JWT_SECRET=\(.JWT_SECRET)"' >> "$GITHUB_ENV"
      - name: swift test (unit and live-stack integration tests)
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/w" -w /w/ios/Packages/AppCore \
            -e SUPABASE_URL -e SUPABASE_ANON_KEY -e SUPABASE_SERVICE_ROLE_KEY -e SUPABASE_JWT_SECRET \
            swift:6.1.2-noble bash /w/.github/scripts/ios-core-test.sh

  ios:
    name: "ios (xcodebuild: app, widgets, notification service, App Clip, tests)"
    runs-on: macos-15
    timeout-minutes: 75
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      # Retried: a macOS runner's DNS sometimes misses ghcr.io for a moment (run 97: "Could not resolve host: ghcr.io").
      - name: install XcodeGen
        run: for i in 1 2 3; do brew install xcodegen && break || sleep $((i * 20)); done; command -v xcodegen
      - name: generate project
        working-directory: ios
        run: xcodegen generate
      # Signed ad hoc for the simulator ("Sign to Run Locally", no team): the app then carries its entitlements as the
      # simulator's, application-identifier included, which the Keychain needs. Unsigned (CODE_SIGNING_ALLOWED=NO), every
      # Keychain call fails with errSecMissingEntitlement: AppDataSimulatorTests.testTheSessionRoundTripsThroughTheKeychain.
      - name: build and test
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -destination "id=$SIM" -derivedDataPath build -IDEBuildingContinueBuildingAfterErrors=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 'OTHER_SWIFT_FLAGS=$(inherited) -continue-building-after-errors' test 2>&1 | tee xcodebuild.log | grep -E "error:|Test Suite|Executed|BUILD|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: upload logs and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            ios/xcodebuild.log
            ios/build/snapshots
          if-no-files-found: ignore

  ios-ui:
    name: ios ui tests
    runs-on: macos-15
    timeout-minutes: 75
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      # Retried: a macOS runner's DNS sometimes misses ghcr.io for a moment (run 97: "Could not resolve host: ghcr.io").
      - name: install XcodeGen
        run: for i in 1 2 3; do brew install xcodegen && break || sleep $((i * 20)); done; command -v xcodegen
      - name: generate project
        working-directory: ios
        run: xcodegen generate
      # The macOS runner has no Docker, so no backend: each UI test launches the app with DEBUG launch arguments that
      # select in-process fakes (-account-ui-test-scenario, -capture-fakes, -SocialFakes, -MemoryFixtures).
      - name: UI tests on the simulator
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme AppUITests -destination "id=$SIM" -derivedDataPath build -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee xcodebuild-ui.log | grep -E "error:|Test Case|Test Suite|Executed|skipped|BUILD|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild-ui.log
      # The app's DEBUG sign-up trace (AccountTrace, subsystem app.account.trace) from the simulator's unified log.
      - name: the app's sign-up trace
        if: always()
        working-directory: ios
        run: xcrun simctl spawn "$SIM" log show --last 2h --style compact --predicate 'subsystem == "app.account.trace"' > sim-account.log 2>&1 || true
      - name: upload the log and the result bundle (screenshots of failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-results
          path: |
            ios/xcodebuild-ui.log
            ios/sim-account.log
            ios/build/UITests.xcresult
          if-no-files-found: ignore

  # The iOS app against a real server. GitHub's macOS runners cannot run Docker, so two jobs of the same run work
  # together: "ios e2e server" (Linux) starts the local Supabase with the journey's test settings and the worker,
  # exposes the API through a Cloudflare quick tunnel (pinned cloudflared, no account) and uploads its address as the
  # ios-e2e-server artifact, then keeps everything up until "ios e2e" has finished and reports what the server and the
  # worker did; "ios e2e" (macOS) builds the app and the journey (ios/AppUITests/ServerJourney, -D SERVER_JOURNEY), waits
  # for that artifact and runs the journey on the simulator with the app pointed at the tunnel (DEBUG launch
  # environment, ServerJourneyOverrides). Both read the run through the GitHub API with their job token (actions: read).
  ios-e2e-server:
    name: ios e2e server (stack, worker, tunnel)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: detect
    if: needs.detect.outputs.ios == 'true' && needs.detect.outputs.backend == 'true'
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Maya and Theo of the iOS journey: +1 201 555 0111 / 0112 (ServerJourneyUITests.swift).
      - name: start Supabase (migrations applied) with the journey's test settings
        working-directory: backend
        run: bash ../.github/scripts/start-test-stack.sh 12015550111 12015550112
      - name: start the worker
        run: bash .github/scripts/start-worker.sh build/ios-e2e/worker.log
      - name: open the tunnel
        run: bash .github/scripts/ios-e2e-tunnel.sh build/ios-e2e-server build/ios-e2e/cloudflared.log
      - name: hand the address to the macOS job
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-server
          path: build/ios-e2e-server/server.json
          retention-days: 1
      - name: serve until the iOS journey has finished
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ios-e2e-wait.sh "ios e2e (the app against a real server)" 80
      - name: what the server and the worker did
        run: |
          set -o pipefail
          # Realtime's log and the gateway's Realtime requests (WebSocket upgrades: 101), for the journey's live steps.
          docker logs "$(docker ps --format '{{.Names}}' | grep '^supabase_realtime_' | head -1)" > build/ios-e2e/realtime.log 2>&1 || true
          docker logs "$(docker ps --format '{{.Names}}' | grep '^supabase_kong_' | head -1)" 2>&1 | grep '/realtime/' > build/ios-e2e/gateway-realtime.log || true
          bash .github/scripts/e2e-server-check.sh ios | tee build/ios-e2e/server.txt
      - name: upload the server's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-server-evidence
          path: build/ios-e2e
          if-no-files-found: warn

  ios-e2e:
    name: ios e2e (the app against a real server)
    runs-on: macos-15
    timeout-minutes: 75
    needs: detect
    if: needs.detect.outputs.ios == 'true' && needs.detect.outputs.backend == 'true'
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      # Retried: a macOS runner's DNS sometimes misses ghcr.io for a moment (run 97: "Could not resolve host: ghcr.io").
      - name: install XcodeGen
        run: for i in 1 2 3; do brew install xcodegen && break || sleep $((i * 20)); done; command -v xcodegen
      - name: generate project
        working-directory: ios
        run: xcodegen generate
      # Signed ad hoc for the simulator, like the "ios" job: unsigned, the app has no application-identifier, the Keychain
      # refuses the session and the sign-in is lost right after the code (run 102). The build prints the simulator
      # entitlements Xcode generated for the app.
      - name: build the app and the journey
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme AppUITests -destination "id=$SIM" -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 'OTHER_SWIFT_FLAGS=$(inherited) -D SERVER_JOURNEY' build-for-testing 2>&1 | tee xcodebuild-e2e-build.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" xcodebuild-e2e-build.log
          find build/Build/Intermediates.noindex -name '*.app-Simulated.xcent' -print -exec plutil -p {} \; || true
      - name: wait for the server's address
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "ios-e2e-server") | .id' | head -1)
            if [ -n "$ID" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > server.zip
              unzip -o -q server.zip -d server
              URL=$(python3 -c "import json; print(json.load(open('server/server.json'))['url'])")
              ANON=$(python3 -c "import json; print(json.load(open('server/server.json'))['anonKey'])")
              echo "::add-mask::$URL"
              echo "TEST_RUNNER_JOLT_E2E_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
              echo "TEST_RUNNER_JOLT_E2E_SUPABASE_ANON_KEY=$ANON" >> "$GITHUB_ENV"
              curl -fsS -m 20 -H "apikey: $ANON" "$URL/auth/v1/health" > /dev/null && echo "the stack answers through the tunnel"
              exit 0
            fi
            sleep 20
          done
          echo "no ios-e2e-server artifact after 30 minutes"
          exit 1
      - name: the journey on the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme AppUITests -destination "id=$SIM" -derivedDataPath build -resultBundlePath build/ServerJourney.xcresult CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 'OTHER_SWIFT_FLAGS=$(inherited) -D SERVER_JOURNEY' -only-testing:AppUITests/ServerJourneyUITests test-without-building 2>&1 | tee xcodebuild-e2e.log | grep -E "error:|Test Case|Executed|\*\*" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" xcodebuild-e2e.log
      - name: the journey's screenshots
        if: always()
        working-directory: ios
        run: mkdir -p e2e && (xcrun xcresulttool export attachments --path build/ServerJourney.xcresult --output-path e2e || true)
      # The app's DEBUG traces from the simulator's unified log: sign-up (AccountTrace, app.account.trace) and Realtime
      # (AppData RealtimeTrace, app.data.realtime: joins, failures, status changes, events by kind).
      - name: the app's traces
        if: always()
        working-directory: ios
        run: xcrun simctl spawn "$SIM" log show --last 2h --style compact --predicate 'subsystem == "app.account.trace" OR subsystem == "app.data.realtime"' > e2e-sim-account.log 2>&1 || true
      - name: upload the journey's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e
          path: |
            ios/e2e
            ios/e2e-sim-account.log
            ios/xcodebuild-e2e.log
            ios/xcodebuild-e2e-build.log
          if-no-files-found: ignore

  # Jolt to try on a Mac, in Xcode's iPhone simulator: a DEBUG build with the DEMO flag, which starts signed in on
  # built-in sample data (one world of groups, people, photos, chats and memories; no backend, no account). Download the
  # "jolt-demo" artifact, unzip it, and drag Jolt.app onto the Simulator window.
  ios-demo:
    name: ios demo build (Jolt for the simulator)
    runs-on: macos-15
    timeout-minutes: 45
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      # Retried: a macOS runner's DNS sometimes misses ghcr.io for a moment (run 97: "Could not resolve host: ghcr.io").
      - name: install XcodeGen
        run: for i in 1 2 3; do brew install xcodegen && break || sleep $((i * 20)); done; command -v xcodegen
      # The demo world's photos (DemoPhotos.swift): the sample photos, in this build's bundle only.
      - name: bundle the sample photos
        working-directory: ios
        run: mkdir -p App/Resources/DemoPhotos && cp ../fixtures/photos/*.jpg App/Resources/DemoPhotos/
      - name: generate project
        working-directory: ios
        run: xcodegen generate
      # Both architectures, so it runs on Apple silicon and Intel Macs. Unsigned: the simulator does not require signing.
      - name: build the demo app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO 'OTHER_SWIFT_FLAGS=$(inherited) -D DEMO' build 2>&1 | tee xcodebuild-demo.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild-demo.log
          rm -rf demo && mkdir demo && cp -R build/Build/Products/Debug-iphonesimulator/App.app demo/Jolt.app
          (cd demo && ditto -c -k --sequesterRsrc --keepParent Jolt.app Jolt-demo.zip)
      - name: upload the demo app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jolt-demo
          path: |
            ios/demo/Jolt-demo.zip
            ios/xcodebuild-demo.log
          if-no-files-found: ignore

  # The Jolt demo, opened and walked like the owner will: DemoTourUITests launches the demo build with no arguments and
  # screenshots each main screen (camera, sending a photo, groups, a group, chat, viewer, On This Day, recaps, albums,
  # People, Profile); the screenshots are the jolt-demo-tour artifact.
  ios-demo-tour:
    name: ios demo tour (the Jolt demo's screens)
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 60
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      # Retried: a macOS runner's DNS sometimes misses ghcr.io for a moment (run 97: "Could not resolve host: ghcr.io").
      - name: install XcodeGen
        run: for i in 1 2 3; do brew install xcodegen && break || sleep $((i * 20)); done; command -v xcodegen
      - name: bundle the sample photos
        working-directory: ios
        run: mkdir -p App/Resources/DemoPhotos && cp ../fixtures/photos/*.jpg App/Resources/DemoPhotos/
      - name: generate project
        working-directory: ios
        run: xcodegen generate
      - name: walk the demo
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$SIM" || true
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme AppUITests -destination "id=$SIM" -derivedDataPath build -resultBundlePath build/DemoTour.xcresult CODE_SIGNING_ALLOWED=NO 'OTHER_SWIFT_FLAGS=$(inherited) -D DEMO' -only-testing:AppUITests/DemoTourUITests test 2>&1 | tee xcodebuild-tour.log | grep -E "error:|Test Case|Executed|BUILD|\*\*" || true
          mkdir -p tour && (xcrun xcresulttool export attachments --path build/DemoTour.xcresult --output-path tour || true)
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild-tour.log
      - name: commit the tour's screens
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.commit_screens }}
        run: bash .github/scripts/commit-screens.sh ios/tour design/screens/ios-demo xcresult
      - name: upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jolt-demo-tour
          path: |
            ios/tour
            ios/xcodebuild-tour.log
          if-no-files-found: ignore

  # The Release configuration (what TestFlight and the App Store get; every other job builds Debug): unsigned, for the
  # simulator, so a Release-only compile error shows on every push instead of at the first TestFlight upload.
  ios-release:
    name: ios release build (what TestFlight gets)
    runs-on: macos-15
    timeout-minutes: 45
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      # Retried: a macOS runner's DNS sometimes misses ghcr.io for a moment (run 97: "Could not resolve host: ghcr.io").
      - name: install XcodeGen
        run: for i in 1 2 3; do brew install xcodegen && break || sleep $((i * 20)); done; command -v xcodegen
      - name: generate project
        working-directory: ios
        run: xcodegen generate
      - name: build Release
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-release.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild-release.log
