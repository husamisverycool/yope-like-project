name: try Jolt on your Mac

# The real app on the Mac's iPhone Simulator, before the Apple Developer account is approved: no Apple, Supabase,
# Twilio or Fly.io account needed. Two jobs:
#   - "server": a throwaway copy of the whole backend (Supabase with every migration, plus the worker) on a GitHub
#     runner, reachable through a Cloudflare quick tunnel, for about 5 hours 50 minutes. Sign-in uses the fictional
#     numbers below with the code 123456 (no texts are sent). Everything on it is deleted when the run ends.
#   - "app": the Release build of the app for the Simulator, pointed at that server, kept as the artifact
#     "Jolt-for-Simulator" (inside it, Jolt-try.zip: double-click it, then drag Jolt onto the Simulator).
# Each run is a new server at a new address, so a new run needs the new Jolt from that run. Cancel the run to stop the
# server early. The Simulator has no camera: photos come from the camera screen's library button (drag pictures from
# Finder onto the Simulator window to add them to its Photos).

on:
  workflow_dispatch:

concurrency:
  group: try
  cancel-in-progress: true

jobs:
  server:
    name: server (about 6 hours)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      # +1 201 555 0101 … 0106, code 123456 (fictional numbers reserved for fiction; test OTPs on this throwaway stack only).
      TRY_NUMBERS: "12015550101 12015550102 12015550103 12015550104 12015550105 12015550106"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: start Supabase (every migration applied)
        working-directory: backend
        run: bash ../.github/scripts/start-test-stack.sh $TRY_NUMBERS
      - name: start the worker
        run: bash .github/scripts/start-worker.sh build/try/worker.log
      - name: open the tunnel
        run: bash .github/scripts/ios-e2e-tunnel.sh build/try-server build/try/cloudflared.log
      - name: hand the address to the app job
        uses: actions/upload-artifact@v4
        with:
          name: try-server
          path: build/try-server/server.json
          retention-days: 1
      - name: serve
        run: |
          END=$(( $(date +%s) + 340 * 60 ))
          {
            echo "## Jolt's trial server is up"
            echo "Until about **$(date -u -d "@$END" '+%H:%M') UTC** ($(TZ=America/New_York date -d "@$END" '+%-I:%M %p') New York time)."
            echo
            echo "Sign in with any of these numbers (country: United States) and the code **123456**:"
            for n in $TRY_NUMBERS; do echo "- +1 ${n:1:3} ${n:4:3} ${n:7:4}"; done
          } >> "$GITHUB_STEP_SUMMARY"
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 300
            curl -fsS -m 20 -H "apikey: $E2E_ANON_KEY" "$E2E_TUNNEL_URL/auth/v1/health" > /dev/null \
              && echo "$(date -u +%H:%M) up" || echo "$(date -u +%H:%M) the tunnel did not answer"
          done
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: try-server-logs
          path: build/try
          retention-days: 3
          if-no-files-found: ignore

  app:
    name: Jolt for the Simulator
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: install XcodeGen
        run: for i in 1 2 3; do brew install xcodegen && break || sleep $((i * 20)); done; command -v xcodegen
      - name: wait for the server's address
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "try-server") | .id' | head -1)
            if [ -n "$ID" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > server.zip
              unzip -o -q server.zip -d "$RUNNER_TEMP/server"
              exit 0
            fi
            sleep 20
          done
          echo "no try-server artifact after 30 minutes"
          exit 1
      # Only this run's copy of config/app.json (never committed): the app reads its server from the bundled file.
      - name: point the app at the server
        run: |
          python3 - "$RUNNER_TEMP/server/server.json" <<'PY'
          import json, sys
          server = json.load(open(sys.argv[1]))
          path = "config/app.json"
          config = json.load(open(path))
          config["supabase"] = {"url": server["url"], "anonKey": server["anonKey"]}
          json.dump(config, open(path, "w"), indent=2)
          print("server:", server["url"])
          PY
      - name: generate project
        working-directory: ios
        run: xcodegen generate
      # Release, for both Mac kinds (Apple silicon and Intel), signed ad hoc like the CI simulator builds: unsigned, the
      # Keychain refuses the session and the sign-in is lost right after the code.
      - name: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
      - name: pack
        run: |
          APP=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          lipo -info "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          mkdir -p out
          ditto "$APP" out/Jolt.app
          (cd out && ditto -c -k --sequesterRsrc --keepParent Jolt.app Jolt-try.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: Jolt-for-Simulator
          path: out/Jolt-try.zip
          retention-days: 3
      - name: build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: try-build-log
          path: ios/build.log
          if-no-files-found: ignore
