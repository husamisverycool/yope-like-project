<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fonts of the worker's rendered text (src/tribute/render.ts sets FONTCONFIG_FILE to this file before the first
     render): the app's faces in this folder, then the fallback set (fonts/fallback/scripts and the colour emoji of fonts/fallback/emoji-color;
     fonts/fallback/SOURCE.txt) for the scripts
     and emoji the app's faces lack. No system fonts: renders are the same in the image, in CI and on a laptop.
     Text asks for "<app face>, serif" (display role) or "<app face>, sans-serif" (UI role); emoji runs ask for
     "Noto Color Emoji" by name. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir prefix="relative">../../../fonts/fallback/scripts</dir>
  <dir prefix="relative">../../../fonts/fallback/emoji-color</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Serif Hebrew</family>
      <family>Noto Serif Devanagari</family>
      <family>Noto Serif Thai</family>
      <family>Noto Sans SC</family>
      <family>Noto Sans KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans SC</family>
      <family>Noto Sans KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
