# XcodeGen spec (`xcodegen generate` in ios/ → App.xcodeproj; CI job `ios`).
#
# Build settings live in Config/*.xcconfig: Base.xcconfig (identity, versions, Swift mode,
# non-copy Info.plist keys) + InfoPlist.generated.xcconfig (purpose strings, generated by
# tools/designgen.mjs) + one file per target. Bundle ids derive from APP_BUNDLE_ID:
#   App                  $(APP_BUNDLE_ID)
#   Widgets              $(APP_BUNDLE_ID).widgets               (home/lock-screen widgets + Live Activity)
#   NotificationService  $(APP_BUNDLE_ID).notificationservice
#   ShareExtension       $(APP_BUNDLE_ID).share                 ("Share to Jolt", share.in)
#   AppClip              $(APP_BUNDLE_ID).Clip
# App Group: group.$(APP_BUNDLE_ID). Override per build: `xcodebuild … APP_BUNDLE_ID=com.example.x`.
name: App

options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

packages:
  AppCore:
    path: Packages/AppCore
  # Linked through AppCore/AppData too (Packages/AppCore/Package.swift pins the same version).
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.4
  # Linked through AppCore/AppServices (Packages/AppCore/Package.swift pins the same version).
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.95.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: 1.19.6
  # auth.phone as-you-type formatting (PartialFormatter, the Swift port of libphonenumber's AsYouTypeFormatter that
  # Android uses). 4.2.13 is the last release before the repository's 4.3.0 deprecation notice.
  PhoneNumberKit:
    url: https://github.com/marmelroy/PhoneNumberKit.git
    exactVersion: 4.2.13

targets:
  App:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: App/Sources
      # The camera intent (camera.quickaccess): also in Widgets — a control's intent must exist in both targets.
      - path: Intents
      # Asset catalog: the "Ideas to Get Started" template covers (groups.list.layout.templateCovers, owner decision 9);
      # en.lproj/Localizable.strings: the App Intents keys tools/designgen.mjs generates.
      - path: App/Resources
      # config/app.json is the single source of app configuration; bundled as app.json.
      - path: ../config/app.json
        buildPhase: resources
      # Privacy manifest (required-reason APIs, collected data; docs/PRIVACY_LABELS.md).
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        # The app icon of owner decision 32 (tools/appicon.py); no accent colour set in the catalog.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    dependencies:
      - target: Widgets
      - target: NotificationService
      # share.in: the Share Extension (photos and videos from the share sheet → camera.sendto).
      - target: ShareExtension
      - target: AppClip
      - package: AppCore
        product: AppModels
      - package: AppCore
        product: DesignSystem
      - package: AppCore
        product: AppServices
      # Backend client (auth, repositories, uploads, realtime, offline cache, session glue).
      - package: AppCore
        product: AppData
      - package: Supabase
        product: Supabase
      # The paywall reads RevenueCat's offerings and packages (PurchasesService's public API exposes them).
      - package: RevenueCat
        product: RevenueCat
      # auth.phone formatting (Features/Account/Shared/PhoneNumberInput.swift).
      - package: PhoneNumberKit
        product: PhoneNumberKit

  Widgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Widgets.xcconfig
      Release: Config/Widgets.xcconfig
    sources:
      - path: Widgets/Sources
      - path: Intents
      # en.lproj/Localizable.strings: the widget configuration intents' keys (tools/designgen.mjs).
      - path: Widgets/Resources
      - path: Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: AppCore
        product: AppModels
      - package: AppCore
        product: DesignSystem

  NotificationService:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/NotificationService.xcconfig
      Release: Config/NotificationService.xcconfig
    sources:
      - path: NotificationService/Sources
      - path: NotificationService/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: AppCore
        product: AppModels

  # share.in ("Share to Jolt", design/surfaces/share.in.md): copies shared photos and videos into the App Group inbox
  # (AppModels ShareInbox) and opens the app's own scheme; the app shows camera.sendto with them.
  ShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/ShareExtension.xcconfig
      Release: Config/ShareExtension.xcconfig
    sources:
      - path: ShareExtension/Sources
      - path: ShareExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: AppCore
        product: AppModels

  AppClip:
    type: application.on-demand-install-capable
    platform: iOS
    configFiles:
      Debug: Config/AppClip.xcconfig
      Release: Config/AppClip.xcconfig
    sources:
      - path: AppClip/Sources
      # The App Clip's own icon set (the app icon, owner decision 32; App Store Connect requires one per target).
      - path: AppClip/Resources
      # Shared with the app: components (buttons, fields, HUD, toast…) and the account group's invite preview,
      # SMS code step and data seam (ios/App/Sources/Features/Account/Shared).
      - path: App/Sources/Components
      - path: App/Sources/Features/Account/Shared
      - path: ../config/app.json
        buildPhase: resources
      - path: AppClip/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: AppCore
        product: AppModels
      - package: AppCore
        product: DesignSystem
      # Invite preview, phone sign-in and join (foreground uploads only: App Clips get no
      # background networking).
      - package: AppCore
        product: AppData
      # auth.phone formatting in the shared phone form (Features/Account/Shared/PhoneNumberInput.swift).
      - package: PhoneNumberKit
        product: PhoneNumberKit

  AppTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    sources:
      - path: AppTests
    dependencies:
      # Hosted by the app (TEST_HOST is set by XcodeGen) for `@testable import App`.
      - target: App
      - package: SnapshotTesting
        product: SnapshotTesting
      # Linked into the test bundle as well so tests of package code never depend on what the
      # app happens to reference (Xcode reports the duplicated static code as a warning).
      - package: AppCore
        product: AppModels
      - package: AppCore
        product: DesignSystem
      - package: AppCore
        product: AppServices
      - package: AppCore
        product: AppData
      # AppData's public API exposes supabase-swift types (e.g. Auth.AuthLocalStorage); the test
      # bundle must link the module itself or the protocol descriptor is undefined at link time.
      - package: Supabase
        product: Supabase

  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    sources:
      - path: AppUITests
    dependencies:
      - target: App

schemes:
  App:
    build:
      targets:
        App: all
        Widgets: all
        NotificationService: all
        ShareExtension: all
        AppClip: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: AppTests
        # Built with every test run; they run in their own scheme below (CI job "ios ui tests").
        - name: AppUITests
          skipped: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # The UI tests (ios/AppUITests): the app launched on the simulator with DEBUG launch arguments that select in-process
  # fakes (no backend on the macOS runner: it has no Docker). CI job "ios ui tests".
  AppUITests:
    build:
      targets:
        App: [run, test]
        AppUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: AppUITests
