<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fonts of the invite share image (web/src/images.ts sets FONTCONFIG_FILE to this file before the first render): the
     bundled OFL faces in this folder, then the fallback set (fonts/fallback/scripts and the monochrome emoji of
     fonts/fallback/emoji-mono; fonts/fallback/SOURCE.txt) for the scripts and emoji these faces lack. librsvg draws
     SVG text as filled outlines, so a colour emoji font would come out as silhouettes: the monochrome Noto Emoji is the
     one this renderer can draw. No system fonts: the image is the same in the container, in CI and on a laptop.
     Text asks for "<face>, serif" (the name) or "<face>, sans-serif" (the domain); emoji runs ask for "Noto Emoji". -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir prefix="relative">../../../fonts/fallback/scripts</dir>
  <dir prefix="relative">../../../fonts/fallback/emoji-mono</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Serif Hebrew</family>
      <family>Noto Serif Devanagari</family>
      <family>Noto Serif Thai</family>
      <family>Noto Sans SC</family>
      <family>Noto Sans KR</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans SC</family>
      <family>Noto Sans KR</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
</fontconfig>
